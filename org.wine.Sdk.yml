id: org.wine.Sdk
id-platform: org.wine.Platform
branch: &app-version '11.15'
build-runtime: true
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64 # Needed for cross-compiling 32/64bit Wine (Compiling Wine Windows dlls, fex-wine and rpc-bridge)
modules:
  # Setting up required stuff
  - name: Setup
    buildsystem: simple
    build-commands:
      - |
        # Make directories needed by extensions
        mkdir -p ${FLATPAK_DEST}/lib/codecs                      # Codecs (replaces ffmpeg-full & openh264)
        mkdir -p ${FLATPAK_DEST}/lib/ffmpeg                      # FFmpeg (Not sure if still needed codecs-extra replaced ffmpeg in 25.08)

        # Make docs directories needed by modules
        mkdir -p /usr/share/runtime/docs/man                     # /usr/share/man symlinks here but it is not created by default and can cause errors when building modules
        mkdir -p /usr/share/runtime/docs/info                    # /usr/share/info symlinks here but it is not created by default and can cause errors when building modules
        mkdir -p /usr/share/runtime/docs/doc                     # /usr/share/doc symlinks here but it is not created by default and can cause errors when building modules
        mkdir -p /usr/share/runtime/docs/ri                      # /usr/share/ri symlinks here but it is not created by default and can cause errors when building modules

        # Make locale directories needed by modules
        pushd /usr/share/locale                                  # Change to /usr/share/locale directory, and store current directory to be popd back to below
        for link in `find . -type l`; do                         # For each symlink in /usr/share/locale
          mkdir -p $(readlink  $link)                            # Make the directory the symlink is pointing to (If it doesn't already exist)
        done
        popd                                                     # Change back to starting directory (location where last pushd was used above)

  - name: llvm-mingw
    only-arches:
      - aarch64
    sources:
      - type: archive
        url: https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-aarch64.tar.xz
        sha256: e7e5d135d93d3f2a3beaaea633a5b0e66ac75391a53feae654391913dd76102b
        strip-components: 1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest
          tag-query: .tag_name
          version-query: .tag_name
          url-query: >-
            .assets[] | select(.name == "llvm-mingw-" + $version + "-ucrt-ubuntu-22.04-aarch64.tar.xz") | .browser_download_url
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/lib/llvm-mingw
      - cp -a . ${FLATPAK_DEST}/lib/llvm-mingw/

  - name: wine
    sources:
      - type: git
        url: https://gitlab.winehq.org/wine/wine.git
        tag: wine-11.15
        commit: 2df1ee28039cf84776eb1421ed90bd154cebb65f
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^wine-(\d+\.\d+)$ # Regex pattern that matches latest git tag and compares it to source
          is-main-source: true
    build-options:
      # no-debuginfo: true # Keep debug symbols in main org.wine.Sdk, instead of the Flatpak default of putting them in org.wine.Sdk.Debug extension
      arch:
        aarch64:
          append-path: /usr/lib/llvm-mingw/bin # Add llvm-mingw compiler to the path
          config-opts:
            - --prefix=${FLATPAK_DEST}
            - --enable-archs=aarch64,arm,arm64ec,i386 # Build for aarch64 - 64bit ARM dll/exe, arm - 32bit ARM dll/exe, arm64ec - Native 64bit x86 Windows dll/exe rebuilt for running on ARM, i386 - 32bit x86 dll/exe
            - --with-mingw=clang                      # Use LLVM/Clang compilers (Some --enable-archs require this)
            - --disable-winemenubuilder
            - --disable-tests
            - --disable-opencl
          libdir: /usr/lib
      env:
        LIBDIR: lib
        CFLAGS: -fno-stack-protector # Override org.freedesktop.Sdk default -fstack-protector-strong (Can cause segmentation faults on ARM without this)
    make-install-args:
      - LDCONFIG=/bin/true                # When make install calls ldconfig return true (Default can cause problems when building in a Flatpak)
      - UPDATE_DESKTOP_DATABASE=/bin/true # When make install calls update-desktop-database return true (Default can cause problems when building in a Flatpak)
      - INSTALL_PROGRAM_FLAGS=-s          # Strip debug symbols from binaries when installed (Smaller install size at the cost of harder debugging)
    cleanup:
      - '*.a'
      - '*.la'
      - /share/et
      - /share/examples
      - /share/man
      - /include
      - /lib/pkgconfig

  - name: fex-wine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/llvm-mingw/bin:/usr/lib/sdk/llvm21/bin:/usr/lib/sdk/mingw-w64/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
      env:
        CC: clang
        CXX: clang++
    sources:
      - type: git
        url: https://github.com/FEX-Emu/FEX.git
        tag: FEX-2608
        submodules: true
        x-checker-data:
          type: git
          tag-pattern: ^FEX-(\d+(\.\d+)?)$
    build-commands:
      - |
        unset CFLAGS CXXFLAGS LDFLAGS ASFLAGS # Unset default Flatpak flags (They cause errors here)

        # FEXServer and FEXInterpreter (WoW64 32bit backend needs these for running 32bit x86 dll/exe)
        mkdir build-host
        cd build-host
        cmake -GNinja \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_LTO=False \
          -DBUILD_TESTS=False \
          -DBUILD_TESTING=False \
          -DBUILD_FEXCONFIG=False \
          ..
        ninja FEXServer
        ls -la  # Debugging
        install -Dm755 Bin/FEXServer ${FLATPAK_DEST}/bin/FEXServer
        cd ..

        # WoW64 32bit backend (Allows running 32bit x86 dll/exe)
        mkdir build-wow64
        cd build-wow64
        cmake -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DMINGW_TRIPLE=aarch64-w64-mingw32 \
          -DENABLE_LTO=False \
          -DBUILD_TESTS=False \
          -DBUILD_TESTING=False \
          -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
          -DTUNE_CPU=none \
          ..
        ninja wow64fex
        install -Dm755 Bin/libwow64fex.dll ${FLATPAK_DEST}/lib/wine/aarch64-windows/xtajit.dll # Install/rename the wow64 fex-wine dll in place of the Windows expected xtajit dll
        cp -a Bin/*.dll ${FLATPAK_DEST}/lib/wine/aarch64-windows/
        cd ..
 
        # ARM64EC 64bit backend (Allows running 64bit x86 dll/exe)
        mkdir build-arm64ec
        cd build-arm64ec
        cmake -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
          -DENABLE_LTO=False \
          -DBUILD_TESTS=False \
          -DBUILD_TESTING=False \
          -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
          -DTUNE_CPU=none \
          ..
        ninja arm64ecfex
        install -Dm755 Bin/libarm64ecfex.dll ${FLATPAK_DEST}/lib/wine/aarch64-windows/xtajit64.dll # Install/rename the arm64ec fex-wine dll in place of the Windows expected xtajit64 dll
        cp -a Bin/*.dll ${FLATPAK_DEST}/lib/wine/aarch64-windows/
        cd ..