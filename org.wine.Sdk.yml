id: org.wine.Sdk
branch: &app-version '11.15'
build-runtime: true
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64
modules:
  - name: wine
    sources:
      - type: git
        url: https://gitlab.winehq.org/wine/wine.git
        tag: wine-11.15
        commit: 2df1ee28039cf84776eb1421ed90bd154cebb65f
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^wine-(\d+\.\d+)$ # Regex pattern that matches latest git tag and compares it to source
          is-main-source: true
    build-options:
      arch:
        aarch64:
          append-path: /usr/lib/sdk/mingw-w64/bin
          config-opts:
            - --enable-archs=aarch64
            - --with-mingw="ccache aarch64-w64-mingw32-gcc"
            - --disable-winemenubuilder
            - --disable-tests
          libdir: /usr/lib
      env:
        LIBDIR: lib
    make-install-args:
      - LDCONFIG=/bin/true
      - UPDATE_DESKTOP_DATABASE=/bin/true
      - INSTALL_PROGRAM_FLAGS=-s
    cleanup:
      - '*.a'
      - '*.la'
      - /share/et
      - /share/examples
      - /share/man
      - /include
      - /lib/pkgconfig
