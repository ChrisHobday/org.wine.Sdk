cleanup:
  - '*.a'           # Static libraries
  - '*.la'          # Libtool archives
  - /share/drirc.d  # XML configuration files for Mesa
  - /share/docs     # Documentation files
  - /share/et       # Error table files
  - /share/examples # Example programs or configurations
  - /share/man      # Man pages
  - /include        # Header files
  - /lib/pkgconfig  # Package config files
  - /lib/debug      # Debug files
