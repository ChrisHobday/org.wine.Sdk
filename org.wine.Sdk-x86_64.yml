      - type: file
        path: org.wine.Platform.metainfo.xml
    buildsystem: simple
    build-commands:
      - |
        install -Dm644 org.wine.Sdk.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/      # Install SDK metainfo
