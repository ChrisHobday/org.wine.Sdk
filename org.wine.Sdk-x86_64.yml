    build-options:
      prepend-path: /usr/lib/sdk/mingw-w64/bin # /usr/lib/sdk/mingw-w64/bin contains x86_64-w64-mingw32-gcc and i686-w64-mingw32-gcc compilers from sdk-extension org.freedesktop.Sdk.Extension.mingw-w64
