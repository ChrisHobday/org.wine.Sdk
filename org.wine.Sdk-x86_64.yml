      # Script that switches a Wine prefix to the default Wine dlls instead of DXVK dlls (Optionally ran by child Apps to update their already initialized Wine prefix)
      - type: file
        path: Scripts/DXVKToWine.sh

      # Script that switches a Wine prefix to the DXVK dlls instead of default Wine dlls (Optionally ran by child Apps to update their already initialized Wine prefix)
      - type: file
