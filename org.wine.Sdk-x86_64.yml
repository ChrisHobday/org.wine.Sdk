id: org.wine.Sdk
id-platform: org.wine.Platform
build-runtime: true
branch: &app-version '11.15'
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Compat.i386              # Needed for building 32bit Wine
  - org.freedesktop.Sdk.Extension.toolchain-i386 # Needed for building 32bit Wine
  - org.freedesktop.Sdk.Extension.mingw-w64      # Needed for cross-compiling 32/64bit Wine (Compiling Wine Windows dlls, fex-wine and rpc-bridge)
  - org.freedesktop.Sdk.Extension.vala           # Needed for building msitools
# platform-extensions:
#   - org.freedesktop.Platform.Locale
# Re-export org.freedesktop.Platform extensions for child Apps to inherit
inherit-extensions:
  - org.freedesktop.Platform.GL           # OpenGL
  - org.freedesktop.Platform.VAAPI.Intel  # Intel VAAPI
  - org.freedesktop.Platform.VulkanLayer  # Vulkan layers like MangoHud, Gamescope, etc
  - org.freedesktop.Platform.Timezones    # Timezone data
  - org.freedesktop.Platform.GStreamer    # GStreamer codec plugins
  - org.freedesktop.Platform.codecs-extra # Video codecs like H.264, H.265, etc
  - org.freedesktop.Platform.Icontheme    # Icon theme assets like Breeze, Adwaita, etc
# inherit-sdk-extensions:
#   - org.freedesktop.Sdk.Extension
# Re-export org.freedesktop.Platform extensions for child Apps to inherit
add-extensions:
  org.freedesktop.Platform.Compat.i386:       # 32bit Linux compatibility
    directory: lib/i386-linux-gnu
    version: *runtime-version

  org.freedesktop.Platform.Compat.i386.Debug: # 32bit Linux compatibility debug
    directory: lib/debug/lib/i386-linux-gnu
    version: *runtime-version
    no-autodownload: true

  org.freedesktop.Platform.GL32:              # 32bit OpenGL
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: 25.08;25.08-extra;1.4
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

  org.freedesktop.Platform.GL32.Debug:        # 32bit OpenGL Debug
    directory: lib/debug/lib/i386-linux-gnu/GL
    version: '1.4'
    versions: 25.08;25.08-extra;1.4
    subdirectories: true
    no-autodownload: true
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

  org.freedesktop.Platform.VAAPI.Intel.i386:  # 32bit Intel VAAPI
    directory: lib/i386-linux-gnu/dri/intel-vaapi-driver
    version: *runtime-version
    versions: *runtime-version
    autodelete: false
    no-autodownload: true
    add-ld-path: lib
    download-if: have-intel-gpu
    autoprune-unless: have-intel-gpu

  org.freedesktop.Platform.codecs-extra:      # Codecs (replaces ffmpeg-full & openh264)
    directory: lib/codecs
    add-ld-path: lib
    version: 25.08-extra
    autodelete: false

  org.freedesktop.Platform.codecs_extra.i386: # 32bit Codecs
    directory: lib32/codecs
    add-ld-path: lib
    version: 25.08-extra
    autodelete: false
# YAML Anchor for 32bit build options, to be referred to by 32bit modules below (Avoids needing to rewrite this out for each 32bit module)
x-compat-i386-build-options: &compat-i386-build-options
  prepend-path: /usr/lib/sdk/toolchain-i386/bin                                   # /usr/lib/sdk/toolchain-i386/bin contains gnu 32bit libs needed for compiling
  prepend-pkg-config-path: /usr/lib32/pkgconfig:/usr/lib/i386-linux-gnu/pkgconfig # Make sure 32-bit dependencies are first on pkg-config search path
  libdir: /usr/lib32                                                              # Install libraries in /usr/lib32
  ldflags: -L/usr/lib32                                                           # Add /usr/lib32 to linker search path for modules without pkg-config
  env:
    CC: ccache i686-unknown-linux-gnu-gcc  # Compile C with GCC using ccache
    CXX: ccache i686-unknown-linux-gnu-g++ # Compile C++ with G++ using ccache
    x86_64_CC: ccache i686-w64-mingw32-gcc # Cross-compile C with x86_64-w64-mingw32-gcc using ccache
modules:
  # Setting up required stuff
  - name: Setup
    buildsystem: simple
    build-commands:
      - |
        # Make directories needed by extensions
        mkdir -p ${FLATPAK_DEST}/lib/i386-linux-gnu              # 32bit Linux compatibility
        touch ${FLATPAK_DEST}/lib/i386-linux-gnu/.keep           # File to make sure this directory is not pruned
        mkdir -p ${FLATPAK_DEST}/lib/debug/lib/i386-linux-gnu    # 32bit Linux compatibility debug
        mkdir -p ${FLATPAK_DEST}/lib/debug/lib/i386-linux-gnu/GL # 32bit OpenGL Debug
        mkdir -p ${FLATPAK_DEST}/lib/codecs                      # Codecs (replaces ffmpeg-full & openh264)
        mkdir -p ${FLATPAK_DEST}/lib32/codecs                    # 32bit Codecs
        mkdir -p ${FLATPAK_DEST}/lib/ffmpeg                      # FFmpeg (Not sure if still needed codecs-extra replaced ffmpeg in 25.08)
        mkdir -p ${FLATPAK_DEST}/lib32/ffmpeg                    # 32bit FFmpeg (Not sure if still needed codecs-extra replaced ffmpeg in 25.08)

        # Make docs directories needed by modules
        mkdir -p /usr/share/runtime/docs/man                     # /usr/share/man symlinks here but it is not created by default and can cause errors when building modules
        mkdir -p /usr/share/runtime/docs/info                    # /usr/share/info symlinks here but it is not created by default and can cause errors when building modules
        mkdir -p /usr/share/runtime/docs/doc                     # /usr/share/doc symlinks here but it is not created by default and can cause errors when building modules
        mkdir -p /usr/share/runtime/docs/ri                      # /usr/share/ri symlinks here but it is not created by default and can cause errors when building modules

        # Make locale directories needed by modules
        pushd /usr/share/locale                                  # Change to /usr/share/locale directory, and store current directory to be popd back to below
        for link in `find . -type l`; do                         # For each symlink in /usr/share/locale
          mkdir -p $(readlink  $link)                            # Make the directory the symlink is pointing to (If it doesn't already exist)
        done
        popd                                                     # Change back to starting directory (location where last pushd was used above)

  # For OpenGL rendering in bitmaps (Optional Wine dependency) (An old version of mesa, good enough for building the libosmesa part we need)
  - name: libosmesa
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/mesa/mesa.git
        tag: mesa-20.2.6
        commit: 7b866d516a7dc0a36dc8ea7ce7733414294e26d9
    config-opts:
      - -Dosmesa=classic     # Only works because we are using old mesa 20.2.6 (If updated will need to be osmesa=true)
      - -Ddri-drivers=[]
      - -Dgallium-drivers=[]
      - -Dvulkan-drivers=[]
      - -Dplatforms=[]
    buildsystem: meson

  # For parallel programming (Optional Wine dependency)
  - name: opencl
    sources:
      - type: git
        url: https://github.com/KhronosGroup/OpenCL-Headers.git
        tag: v2026.05.29
        commit: 6fe718c31a45fe25151362a72ef041c3a1047cbd
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^v(\d[\d\.]+\d)$ # Regex pattern that matches latest git tag and compares it to source
    buildsystem: cmake

  # For handling network traffic/packet capture (Optional Wine dependency)
  - name: libpcap
    sources:
      - type: git
        url: https://github.com/the-tcpdump-group/libpcap.git
        tag: libpcap-1.10.6
        commit: a999701dca5c873779281938baee6bc185a8d4dc
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^libpcap-(\d[\d\.]+\d)$ # Regex pattern that matches latest git tag and compares it to source

  # Middleware for access smart cards (Optional Wine dependency)
  - name: libpcsclite
    sources:
      - type: git
        url: https://github.com/LudovicRousseau/PCSC.git
        tag: 2.5.1
        commit: 09138d7f7d02c714b004d9850f28727fbcc48a97
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^(\d[\d\.]+\d)$ # Regex pattern that matches latest git tag and compares it to source
    config-opts:
      - -Dpolkit=false
      - -Dlibsystemd=false
    buildsystem: meson

  # For handling scanners (Optional Wine dependency)
  - name: libsane
    sources:
      - type: git
        url: https://gitlab.com/sane-project/backends.git
        tag: 1.4.0
        commit: c7e4b5e35e3d614d2b1181d760a717bfc395a203
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^(\d[\d\.]+\d)$ # Regex pattern that matches latest git tag and compares it to source

  # For handling USB devices (Optional Wine dependency)
  - name: libusb
    sources:
      - type: git
        url: https://github.com/libusb/libusb.git
        tag: v1.0.30
        commit: 87a55632db62c9bdc58cd31d3ccfa673f1bb017f
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^v(\d[\d\.]+\d)$ # Regex pattern that matches latest git tag and compares it to source

  # For handling digital cameras (Optional Wine dependency)
  - name: libgphoto2
    sources:
      - type: archive
        url: https://github.com/gphoto/libgphoto2/releases/download/v2.5.34/libgphoto2-2.5.34.tar.xz
        sha256: 51993f5d9bfb6b4e5925cbbe5883085791bff6f81bcacb8ffe1b783ce76d586a
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://raw.githubusercontent.com/gphoto/libgphoto2/refs/heads/master/NEWS                           # Use this file to...
          version-pattern: libgphoto2\s(\d[\d\.]+\d)\srelease                                                       # Search for this regex pattern
          url-template: https://github.com/gphoto/libgphoto2/releases/download/v$version/libgphoto2-$version.tar.xz # Compare this file (found using regex match from above) to the source to see if there is a newer version

  # For handling ISDN devices (Optional Wine dependency)
  - name: libcapi20
    sources:
      - type: archive
        url: https://deb.debian.org/debian/pool/main/libc/libcapi20-3/libcapi20-3_3.27.orig.tar.bz2
        sha256: d8e423d5adba1750f511a2c088296db2a8a2e1e9209401871b01ce411d8ac583
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://deb.debian.org/debian/pool/main/libc/libcapi20-3/ # Use this file to...
          pattern: (libcapi20-3_(\d[\d\.]+\d).orig.tar.bz2)              # Search for this regex pattern and compare it to source to see if there is a newer version
      # Needed because libcapi's config.guess is outdated and doesn't recognize aarch64 architecture
      - type: file
        url: https://git.savannah.gnu.org/cgit/config.git/plain/config.guess
        sha256: ac18bbd7dc3769e1646af49ebba331a391829f4a73579b735dc8d439bd1c7f07
        dest-filename: config.guess
      # Needed because libcapi's config.sub is outdated and doesn't recognize aarch64 architecture
      - type: file
        url: https://git.savannah.gnu.org/cgit/config.git/plain/config.sub
        sha256: f9a31e9a3f5b7cbeb8d8c3f2015895a51e7222130114c9c363fcbccd78e4bf6b
        dest-filename: config.sub

  # For Kerberos authentication protocol (Optional Wine dependency)
  - name: krb5
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://kerberos.org/dist/                                                 # Use this file to...
          version-pattern: Kerberos V5 Release (\d[\d\.]+\d) - current release            # Search for this regex pattern
          url-template: https://kerberos.org/dist/krb5/$major.$minor/krb5-$version.tar.gz # Compare this file (found using regex match from above) to the source to see if there is a newer version
    subdir: src # krb5 has the source code in a subdir called src

  # A Perl driver (Mandatory Samba dependency)
  - name: perl-parse-yapp
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/W/WB/WBRASWELL/Parse-Yapp-1.21.tar.gz
        sha256: 3810e998308fba2e0f4f26043035032b027ce51ce5c8a52a8b8e340ca65f13e5
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://cpan.metacpan.org/authors/id/W/WB/WBRASWELL/ # Use this file to...
          pattern: (Parse-Yapp-(\d[\d\.]+\d).tar.gz)                # Search for this regex pattern and compare it to source to see if there is a newer version
    buildsystem: simple
    build-commands:
      - |
        perl Makefile.PL
        make
        make install

  # For SMB networking protocol (Optional libnetapi Wine dependency)
  - name: samba
    sources:
      - type: archive
        url: https://download.samba.org/pub/samba/stable/samba-4.24.5.tar.gz
        sha256: 6d5d7ee82f5ce9da4135086c9b184e47a58b4b023565f58abbb1f8c8a922306b
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://download.samba.org/pub/samba/stable/ # Use this file to...
          pattern: (samba-(\d[\d\.]+\d).tar.gz)             # Search for this regex pattern and compare it to source to see if there is a newer version
    config-opts:
      - --localstatedir=/var
      - --sharedstatedir=/var/lib
      - --enable-fhs
      - --without-ldap
      - --without-ldb-lmdb
      - --without-json
      - --without-ad-dc
      - --without-ads
      - --without-pam

  # For Open Database Connectivity, talking to SQL type databases (Optional Wine dependency)
  - name: unixodbc
    sources:
      - type: git
        url: https://github.com/lurcher/unixODBC.git
        tag: v2.3.14
        commit: 9a814155d60c44632b23d7b1bb47b17206e21db0
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^v(\d[\d\.]+\d)$ # Regex pattern that matches latest git tag and compares it to source

  - name: wine
    sources:
      - type: git
        url: https://gitlab.winehq.org/wine/wine.git
        tag: wine-11.15
        commit: 2df1ee28039cf84776eb1421ed90bd154cebb65f
        x-checker-data:
          type: git
          tag-pattern: ^wine-(\d+\.\d+)$
        is-main-source: true

      # Wine Staging, bleeding edge wine patches
      - type: git
        url: https://gitlab.winehq.org/wine/wine-staging.git
        tag: v11.15
        commit: 634865f9e409c7101adc6809f23af34d2a668525
        dest: wine-staging
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+)$

      # Script that runs before build and applies the above wine-staging patches
      - type: shell
        commands:
          - ./wine-staging/staging/patchinstall.py DESTDIR="./" --all

    build-options:
      arch:
        x86_64:
          config-opts:
            - --prefix=${FLATPAK_DEST}
            - --enable-archs=x86_64,i386 # Build for x86_64 - 64bit x86 dll/exe, i386 - 32bit x86 dll/exe (Builds in WoW64 mode because 32bit is included)
            - --with-mingw               # Needed for the PE-format builds WoW64 requires (ntdll etc.)
            - --disable-winemenubuilder
            - --disable-tests
      append-path: /usr/lib/sdk/mingw-w64/bin:/usr/lib/sdk/toolchain-i386/bin # Add to PATH, /usr/lib/sdk/mingw-w64/bin contains x86_64-w64-mingw32-gcc and i686-w64-mingw32-gcc compilers from sdk-extension org.freedesktop.Sdk.Extension.mingw-w64, and /usr/lib/sdk/toolchain-i386/bin contains gnu 32bit libs (needed for building the 32bit version of Wine) from org.freedesktop.Sdk.Extension.toolchain-i386
      libdir: /usr/lib
      env:
        LIBDIR: lib
    make-install-args:
      - LDCONFIG=/bin/true                # When make install calls ldconfig return true (Default can cause problems when building in a Flatpak)
      - UPDATE_DESKTOP_DATABASE=/bin/true # When make install calls update-desktop-database return true (Default can cause problems when building in a Flatpak)
      - INSTALL_PROGRAM_FLAGS=-s          # Strip debug symbols from binaries when installed

  # Wine addon that allows opening website content
  - name: wine-gecko
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86.tar.xz
        sha256: 2cfc8d5c948602e21eff8a78613e1826f2d033df9672cace87fed56e8310afb6
        strip-components: 0
        # TODO: Keep tabs that the URL below is good for getting the correct latest version (URL below uses the master version of Wine not the specific version used above and could possibly update Wine Gecko to a newer version before the used Wine version is ready)
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://gitlab.winehq.org/wine/wine/-/raw/master/dlls/appwiz.cpl/addons.c              # Use this file to...
          version-pattern: GECKO_VERSION\s+"(\d[\d\.]+\d)"                                            # Search for this regex pattern
          url-template: https://dl.winehq.org/wine/wine-gecko/$version/wine-gecko-$version-x86.tar.xz # Compare this file (found using regex match from above) to the source to see if there is a newer version

      - type: archive
        url: https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86_64.tar.xz
        sha256: fd88fc7e537d058d7a8abf0c1ebc90c574892a466de86706a26d254710a82814
        strip-components: 0
        # TODO: Keep tabs that the URL below is good for getting the correct latest version (URL below uses the master version of Wine not the specific version used above and could possibly update Wine Gecko to a newer version before the used Wine version is ready)
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://gitlab.winehq.org/wine/wine/-/raw/master/dlls/appwiz.cpl/addons.c                 # Use this file to...
          version-pattern: GECKO_VERSION\s+"(\d[\d\.]+\d)"                                               # Search for this regex pattern
          url-template: https://dl.winehq.org/wine/wine-gecko/$version/wine-gecko-$version-x86_64.tar.xz # Compare this file (found using regex match from above) to the source to see if there is a newer version
    buildsystem: simple
    build-commands:
      - |
        mkdir -p ${FLATPAK_DEST}/share/wine/gecko/           # Make directory path for Wine Gecko
        cp -a wine-gecko-* ${FLATPAK_DEST}/share/wine/gecko/ # Copy Wine Gecko directories keeping file permissions the same

  # Wine addon that replaces the default .NET framework
  - name: wine-mono
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/wine-mono/11.2.0/wine-mono-11.2.0-x86.tar.xz
        sha256: c9fb2e2823acf30b000b8806177db0f40751786136dd3f8fb2be7897b1643d06
        strip-components: 0
        # TODO: Keep tabs that the URL below is good for getting the correct latest version (URL below uses the master version of Wine not the specific version used above and could possibly update Wine Mono to a newer version before the used Wine version is ready)
        x-checker-data:                                                                             # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://gitlab.winehq.org/wine/wine/-/raw/master/dlls/appwiz.cpl/addons.c            # Use this file to...
          version-pattern: MONO_VERSION\s+"(\d[\d\.]+\d)"                                           # Search for this regex pattern
          url-template: https://dl.winehq.org/wine/wine-mono/$version/wine-mono-$version-x86.tar.xz # Compare this file (found using regex match from above) to the source to see if there is a newer version
    buildsystem: simple
    build-commands:
      - |
        mkdir -p ${FLATPAK_DEST}/share/wine/mono/          # Make directory path for Wine Mono
        cp -a wine-mono-* ${FLATPAK_DEST}/share/wine/mono/ # Copy Wine Mono directory keeping file permissions the same

  # For helping to download and install various libraries, fonts, etc into a Wine prefix
  - name: winetricks
    sources:
      - type: git
        url: https://github.com/Winetricks/winetricks.git
        tag: '20260125'
        commit: b76e1ee79ac57d7aceb384f74518fc423265810c
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: git
          tag-pattern: ^(\d+)$ # Regex pattern that matches latest git tag and compares it to source
    buildsystem: simple
    build-commands:
      - |
        make
        make install

  # For extracting Microsoft Cabinet files (used by Wine Tricks)
  - name: cabextract
    sources:
      - type: archive
        url: https://deb.debian.org/debian/pool/main/c/cabextract/cabextract_1.11.orig.tar.gz
        sha256: b5546db1155e4c718ff3d4b278573604f30dd64c3c5bfd4657cd089b823a3ac6
    x-checker-data:
      type: html
      url: https://ftp.debian.org/debian/pool/main/c/cabextract/
      version-pattern: cabextract_(\d[\d\.]+\d)\.orig\.tar\.gz
      url-template: https://deb.debian.org/debian/pool/main/c/cabextract/cabextract_$version.orig.tar.gz

  # Replacement fonts that Windows expects in many instances (Arial, Times New Roman, Courier)
  - name: liberation-fonts-ttf
    sources:
      - type: archive
        url: https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
        sha256: 7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0
        x-checker-data: # Checks for a newer version when org.flathub.flatpak-external-data-checker is ran on this file
          type: html
          url: https://github.com/liberationfonts/liberation-fonts/releases                                                 # Use this file to...
          pattern: (https://github\.com/liberationfonts/liberation-fonts/files/\d+/liberation-fonts-ttf-([\d\.]+)\.tar\.gz) # Search for this regex pattern and compare it to source to see if there is a newer version
    buildsystem: simple
    build-commands:
      - |
        # Make directory paths for Liberation fonts
        mkdir -p ${FLATPAK_DEST}/share/fonts/liberation-mono-fonts/
        mkdir -p ${FLATPAK_DEST}/share/fonts/liberation-sans-fonts/
        mkdir -p ${FLATPAK_DEST}/share/fonts/liberation-serif-fonts/

        # Install Liberation fonts
        install -Dm644 LiberationMono-Bold.ttf -t ${FLATPAK_DEST}/share/fonts/liberation-mono-fonts/
        install -Dm644 LiberationMono-BoldItalic.ttf -t ${FLATPAK_DEST}/share/fonts/liberation-mono-fonts/
        install -Dm644 LiberationMono-Italic.ttf -t ${FLATPAK_DEST}/share/fonts/liberation-mono-fonts/
