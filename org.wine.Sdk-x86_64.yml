    buildsystem: simple
    build-commands:
      - |
        mkdir -p ${FLATPAK_DEST}/share/dxvk/                 # Make directory path for DXVK
        cp -a x32 ${FLATPAK_DEST}/share/dxvk/                # Copy 32bit DXVK keeping file permissions the same
        cp -a x64 ${FLATPAK_DEST}/share/dxvk/                # Copy 64bit DXVK keeping file permissions the same

        install -Dm755 DXVKToWine.sh -t ${FLATPAK_DEST}/bin/ # Install script for switching Wine prefix to default Wine instead of DXVK
        install -Dm755 WineToDXVK.sh -t ${FLATPAK_DEST}/bin/ # Install script for switching Wine prefix to DXVK instead of default Wine

