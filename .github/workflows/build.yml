name: CI
on:
  # Runs workflow on push request for the main branch
  push:
    branches: [ "main" ]

  # Runs workflow on pull request for the main branch
  pull_request:
    branches: [ "main" ]

  # Allows running workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  # Build steps for ARM
  build-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340  # Timeout after 340 minutes. Default limit is 360 minutes

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Install required SDK/runtime + extensions
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk.Extension.mingw-w64//25.08 \
            org.freedesktop.Sdk.Extension.vala//25.08 \
            org.freedesktop.Sdk.Extension.llvm21//25.08

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('org.wine.Sdk-ARM.yml') }}
          restore-keys: |
            flatpak-builder-

      - name: Build
        run: |
          flatpak-builder --force-clean --repo=repo build-dir org.wine.Sdk-ARM.yml

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-arm
          path: |
            repo/
          retention-days: 3
  build-x86_64:
    # Build steps for x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 340  # Timeout after 340 minutes. Default limit is 360 minutes
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h
 
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
 
      - name: Install required SDK/runtime + extensions
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk.Extension.mingw-w64//25.08 \
            org.freedesktop.Sdk.Extension.vala//25.08 \
            org.freedesktop.Sdk.Compat.i386//25.08 \
            org.freedesktop.Sdk.Extension.toolchain-i386//25.08
 
      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-x86_64-${{ hashFiles('org.wine.Sdk-x86_64.yml') }}
          restore-keys: |
            flatpak-builder-x86_64-
 
      - name: Build
        run: |
          flatpak-builder -v --force-clean --repo=repo --disable-rofiles-fuse build-dir org.wine.Sdk-x86_64.yml
 
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-x86_64
          path: |
            repo/
          retention-days: 3
